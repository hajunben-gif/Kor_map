name: Road Profiles (Drive and Service)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: road-profile-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-pbf-audit.txt
      - name: Install Python dependencies and validate offline
        run: |
          python -m pip install -r requirements.txt -r requirements-pbf-audit.txt pytest
          python -m pytest -q
      - name: Build all profiles using one verified PBF
        run: |
          destination="$RUNNER_TEMP/road-profile-results"
          printf 'PROFILE_OUTPUT=%s\n' "$destination" >> "$GITHUB_ENV"
          python -m scripts.compare_road_profiles --download --output "$destination"
      - name: Verify existing inputs unchanged
        if: always()
        run: git diff --exit-code HEAD -- data inputs output
      - name: Publish validated profiles only
        uses: actions/upload-artifact@v4
        with:
          name: road-profile-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROFILE_OUTPUT }}/
          if-no-files-found: error
          retention-days: 90
      - name: Summarize data validation
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads((Path(os.environ['PROFILE_OUTPUT']) / 'metadata.json').read_text())
          assert metadata['status'] == 'data_validated'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Same-PBF road profile comparison\n\n')
              summary.write(f"- Snapshot: `{metadata['source']['data_timestamp']}`\n")
              summary.write(f"- SHA-256: `{metadata['source']['sha256']}`\n")
              summary.write(f"- Matches prior run snapshot: `{metadata['prior_run_comparison']['same_snapshot']}`\n")
              summary.write('- Data validation passed. Actual relief-vehicle passage remains unverified.\n')
          PY
