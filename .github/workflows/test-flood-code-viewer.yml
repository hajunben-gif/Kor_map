name: Test Flood SEG_CODE Visual Comparison

on:
  pull_request:
    paths:
      - "scripts/verify_flood_seg_code.py"
      - "tests/test_verify_flood_seg_code.py"
      - ".github/workflows/test-flood-code-viewer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GIS and HTML map libraries
        run: python -m pip install "geopandas>=1.0,<2" "folium>=0.20,<1"
      - name: Test offline visual verification kit
        run: python -m unittest discover -s tests -p test_verify_flood_seg_code.py -v
      - name: Test scope note
        run: echo "Synthetic GIS code viewer verified. No real SEG_CODE depth mapping inferred." >> "$GITHUB_STEP_SUMMARY"
