name: Test 100-Year Flood Integration

on:
  pull_request:
    paths:
      - "scripts/integrate_flood_100y.py"
      - "tests/test_integrate_flood_100y.py"
      - ".github/workflows/test-flood-100y-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GeoPandas for synthetic geometry tests
        run: python -m pip install "geopandas>=1.0,<2"
      - name: Test integration and malformed data rejection
        run: python -m unittest discover -s tests -p test_integrate_flood_100y.py -v
      - name: Note synthetic-only scope
        run: echo "Synthetic integration tests passed; user original SHP not accessed in Actions." >> "$GITHUB_STEP_SUMMARY"
